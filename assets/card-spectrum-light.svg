<desc id="d">Team project · Finalist. Governed multi-agent AI for 5G operations. Finalist, 30+ teams / 100+ participants, AWS × FYUZ 2026. I designed the architecture and built the operator console and its signed, hash-chained audit ledger; my teammate and I pair-built the agent and tool layers. 27/27 forbidden tool calls refused (team, in simulation); 14/14 applied only after approval (team, in simulation); 200/245 of my console's files unchanged on final main. Stack: Bedrock, MCP, Cedar, Lambda, FastAPI, React.</desc>
