<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 352" width="432" height="352" role="img" aria-labelledby="t d">
<title id="t">Cogmoz</title>
<desc id="d">Solo project · private. AI-powered spaced repetition for exams. An LLM chat turns what a student studied into topics; a deterministic FSRS engine schedules every review, and the LLM never computes dates. Full stack, deployed pre-launch behind tests and CI. Demo on request. 770 Vitest tests across 47 files; 165/165 CI runs passed; 94.3% of topics reviewed at least once, in simulation. Stack: Next.js, TypeScript, PostgreSQL, Vitest, CI/CD.</desc>
