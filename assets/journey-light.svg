<title id="t">Journey, 2018 to 2026</title>
<desc id="d">2018 to 2022: B.Tech in Computer Science Engineering, Delhi Technological University. 2021: founded MicroNutrition, a student startup. A first-author IEEE paper, 2022. 2022 to 2023: MemoryWizard test-prep platform. 2024 to 2025: M.S. in Computer Science, Columbia University. 2026: Software Development Engineer at Imperial Platforms from March; Cogmoz, July to September; ProofLab, Top-5 Finalist, October; SPECTRUM, Finalist, November; CORTEX, November.</desc>
