<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 352" width="432" height="352" role="img" aria-labelledby="t d">
<title id="t">CORTEX</title>
<desc id="d">Solo project · open source. Long-term memory for Claude Code. Every new chat starts with no memory of earlier ones, and compaction drops detail. CORTEX archives each chat, records decisions with their reasons, and lets the agent search that history through its own MCP tools. 300 sealed questions, one run: a tie with grep; 48/90 dropped details restored on a dev set; ~94x smaller archive than raw chats, one dataset. Stack: Python, SQLite FTS5, BM25, MCP, RAG, LLM evals.</desc>
