<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 618" width="880" height="618" role="img" aria-labelledby="t d">
<title id="t">How I build: six stages from spec to decision</title>
<desc id="d">1. Spec and contracts first: Specs and plans come first; one set of pydantic models defines each record type for Python and TypeScript. (written specs and plans, pydantic v2 → JSON Schema → TypeScript types, JSON data contracts.) Evidenced in SPECTRUM and ProofLab. 2. Parallel AI coding-agent workstreams: Parallel Claude Code sessions, each owning its paths; on SPECTRUM a script fails any diff outside them. (git worktrees, per-path ownership, versioned hand-off packages, shared status file.) Evidenced in SPECTRUM and ProofLab. 3. Fail-closed merge gate: On SPECTRUM a branch merges only if every check passes; Cogmoz runs them in CI on every push to main. (type-check, lint, build, unit tests, seeded property tests, Python/JS canonical-hash parity, headless route smoke, pre-push secret scan.) Evidenced in SPECTRUM and Cogmoz. 4. Pre-registered evaluation: Pass bars are written down before the run, and the final test set stays sealed. (sealed held-out split, majority-of-3 per-fact LLM judge, judge audit, paired-bootstrap 95% CIs, nulls published.) Evidenced in CORTEX. 5. Verifiable evidence: Targets are declared before the runs and every evidence file is hashed, so a judge can re-check it. (declare-before-run records, signed, hash-chained ledger, evidence pack sealed by a SHA-256 manifest.) Evidenced in SPECTRUM and ProofLab. 6. Decisions from the data: A feature that only ties a strong baseline ships opt-in, and the findings feed the next spec. Evidenced in CORTEX.</desc>
