<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 352" width="432" height="352" role="img" aria-labelledby="t d">
<title id="t">ProofLab</title>
<desc id="d">Team project · Top-5 Finalist. Proof that AI agents stayed in bounds. Top-5 Finalist, TM Forum Trustworthy AI &amp; Data Hackathon 2026. I built the human-in-the-loop layer: a breach raises a ServiceNow incident, and an LLM agent's analysis is posted only if it echoes the ground-truth facts exactly. 152 passing test cases recorded for my code; 27 s from incident to AI analysis, judged run; 9 facts the model must echo exactly, or no note. Stack: Python, ServiceNow, Nemotron, OAuth 2.0, pytest.</desc>
