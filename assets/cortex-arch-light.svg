<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 146" width="880" height="146" role="img" aria-labelledby="t d">
<title id="t">CORTEX architecture</title>
<desc id="d">Hook handlers: capture and repair on 6 Claude Code events. Then memory/: redacted chat archive, typed records, notes. Then Retrieval: BM25 over FTS5, reciprocal rank fusion. Then MCP server: 6 memory tools over stdio JSON-RPC. Then Claude Code: the agent searches and records memory. A return path closes the loop: each session feeds the next.</desc>
<style>.at{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328;}.ad{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e;}.wire{fill:none;stroke:#59636e;stroke-opacity:.75;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.sig{fill:none;stroke:#2a78d6;stroke-width:3;stroke-linecap:round;stroke-dasharray:45 100;stroke-dashoffset:45;stroke-opacity:0;animation:sig 8s linear infinite}.lamp{animation:lamp 8s ease-out infinite}@keyframes sig{0%{stroke-dashoffset:45;stroke-opacity:0}1%{stroke-opacity:1}9%{stroke-dashoffset:-100;stroke-opacity:1}10%{stroke-dashoffset:-100;stroke-opacity:0}100%{stroke-dashoffset:-100;stroke-opacity:0}}@keyframes lamp{0%{fill-opacity:1}3%{fill-opacity:.35}9%{fill-opacity:1}100%{fill-opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
