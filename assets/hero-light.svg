<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" role="img" aria-labelledby="t d">
<title id="t">Arth Singh: I build AI agents and the systems behind them.</title>
<desc id="d">Software Engineer · AI Systems &amp; Agent Infrastructure. Long-term memory, retrieval, multi-agent orchestration, evaluation and auditability, on backend engineering in Python and TypeScript. New York · M.S. Computer Science, Columbia University. Open to SDE and AI Engineer roles. The drawing is a row of Ed25519-signed, hash-chained ledger entries under a Merkle root: the audit ledger built for SPECTRUM.</desc>
