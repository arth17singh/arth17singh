<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-labelledby="t d">
<title id="t">CORTEX against its baselines: wins, ties and a loss</title>
<desc id="d">Six comparisons, each a difference in score with its 95% confidence interval. Compaction repair vs a forced grep (share of dropped details restored, dev set): +0.43, +0.26 to +0.59. Always-on memory vs no memory (21 dev tasks, 2 runs, candidate profile with push on): +0.31, +0.16 to +0.46. Always-on memory vs an on-demand grep agent (the same 21 dev tasks; not significant): +0.12, 0.00 to +0.24. Chat archive vs notes only, both read by a grepping agent (90 questions, 2 runs per arm): +0.097, +0.044 to +0.153. CORTEX search vs an agent grepping the same archive (300 sealed held-out LongMemEval questions, one run): −0.005, −0.043 to +0.035. CORTEX v8 search pack vs grep on notes plus archive (the same 90-question run as the archive row): −0.106, −0.169 to −0.047.</desc>
<style>.pt{font:600 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc;}.ps{font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1;}.r1{font:400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc;}.r2{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1;}.ev{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc;font-variant-numeric:tabular-nums;}.ec{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1;font-variant-numeric:tabular-nums;}.ax{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1;font-variant-numeric:tabular-nums;}</style>
